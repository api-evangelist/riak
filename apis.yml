- aid: riak:protocol-buffers
  name: Riak Protocol Buffers Client API
  description: >-
    Higher-performance binary client API for Riak KV using Protocol Buffers messages encoded over a long-lived
    TCP connection. Default port is 8087. Each request message produces one or more response messages
    on the same connection. Message definitions are published in the open source basho/riak_pb repository.
  humanURL: https://docs.riak.com/riak/kv/latest/developing/api/protocol-buffers
