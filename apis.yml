  name: Riak KV HTTP API
  description: >-
    RESTful HTTP API for Riak KV providing GET, PUT, POST, and DELETE access to buckets, objects, secondary
    indexes, search, MapReduce, and CRDT data types. Default port is 8098. Authentication and authorization
    are configured via Riak security on the server.
  humanURL: https://docs.riak.com/riak/kv/latest/developing/api/http
